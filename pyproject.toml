[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ua-auto-check-bot"
version = "0.1.0"
description = "Telegram bot for Ukrainian vehicle checks using official open data"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15,<4",
  "SQLAlchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "redis>=5.2,<6",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "polars>=1.18,<2",
  "structlog>=24.4,<26",
  "greenlet>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "aiosqlite>=0.20,<1",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "data_importer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
